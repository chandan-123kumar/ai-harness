[project]
name = "ai-harness"
version = "0.1.1"
description = "A minimal Python coding-agent harness with local tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub==1.26.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
ai-harness = "cli:run"

[tool.setuptools]
py-modules = ["cli", "inference", "harness_auth"]
packages = ["memory", "tools"]
